<!DOCTYPE html>
<html>
<head>
  <title>Tab Content Rotator</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .button-group {
      display: flex;
      margin-bottom: 10px;
    }
    
    button {
      flex: 1;
      margin: 0 2px;
      padding: 5px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #e0e0e0;
    }
    
    .section {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    
    .toggle-label {
      flex: 1;
    }
    
    #status {
      margin-top: 10px;
      font-style: italic;
      color: #666;
    }
    
    #videoSelectionGroup {
      display: none;
    }
    
    .nav-buttons {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    #videoCounter {
      flex: 1;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Tab Content Rotator</h1>
  
  <div class="section">
    <h2>Remote Video Rotation</h2>
    <div class="button-group">
      <button id="rotate90">90°</button>
      <button id="rotate180">180°</button>
      <button id="rotate270">270°</button>
      <button id="reset">Reset</button>
    </div>
  </div>
  
  <div class="section">
    <h2>Local Video Rotation</h2>
    <div class="toggle-container">
      <span class="toggle-label">Rotate my video:</span>
      <input type="checkbox" id="localVideoToggle">
    </div>
    <div class="button-group">
      <button id="localRotate90">90°</button>
      <button id="localRotate180">180°</button>
      <button id="localRotate270">270°</button>
    </div>
  </div>
  
  <div class="section">
    <h2>Target Selection</h2>
    <div class="button-group">
      <button id="rotateVideo">Videos Only</button>
      <button id="rotateAll">Entire Page</button>
    </div>
    
    <div class="toggle-container">
      <span class="toggle-label">Remote videos only:</span>
      <input type="checkbox" id="remoteOnlyToggle" checked>
    </div>
  </div>
  
  <div id="videoSelectionGroup" class="section">
    <h2>Video Selection</h2>
    <div class="nav-buttons">
      <button id="prevVideo">◀</button>
      <span id="videoCounter">Video 1 of 1</span>
      <button id="nextVideo">▶</button>
    </div>
    <button id="applyToSelected">Apply to Selected Video</button>
  </div>
  
  <div id="status">Ready</div>
  
  <script src="popup.js"></script>
</body>
</html>
